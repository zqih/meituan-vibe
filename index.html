<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="按食堂、预算和口味选菜，查看点评、收藏喜欢的菜品。">
  <title>今天吃哪口 · 校园食堂指南</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a href="#explore" class="skip-link">跳转到菜品</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="今天吃哪口首页">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 21h28c-1 10-7 14-14 14S7 31 6 21Z" fill="currentColor"/><path d="M13 16c-5-5 5-5 0-11m8 11c-5-5 5-5 0-11m8 11c-5-5 5-5 0-11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span>今天吃哪口</span>
      </a>
      <nav class="main-nav" aria-label="主要导航">
        <button class="nav-item active" data-view="discover" aria-current="page">全部菜品</button>
        <button class="nav-item" data-view="ranking">口碑榜单</button>
        <button class="nav-item" data-view="new">食堂上新</button>
        <button class="nav-item" data-view="saved">我的收藏<span id="saved-count" class="count"></span></button>
      </nav>
      <button class="button outline header-review" data-action="review"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></svg>写点评</button>
    </div>
  </header>
  <main class="page-shell">
    <section class="hero" id="hero" aria-label="今日食堂推荐">
      <div class="hero-copy">
        <div class="campus-line"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>南湖大学<span>校园食堂指南</span></div>
        <h1>今天，想吃点什么？</h1>
        <p>看看食堂有什么好吃的，<br>选一顿合口味、合预算的饭。</p>
        <div class="hero-actions">
          <a class="button primary" href="#explore">浏览菜品<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a>
          <button class="button outline hero-random" data-action="random"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01" stroke-width="3"/></svg>随机选餐</button>
        </div>
      </div>
      <button class="hero-feature" data-dish="2" aria-label="查看推荐菜：番茄牛腩面">
        <img src="./assets/noodles.jpg" alt="汤面配图" fetchpriority="high" width="900" height="600">
        <span class="photo-kicker">今日推荐</span>
        <span class="feature-bottom"><span><strong>番茄牛腩面</strong><small>北苑食堂 · 二楼12号窗口</small></span><span class="feature-meta"><span class="feature-rating">★ 4.9</span><span class="feature-price"><small>¥</small>16</span></span></span>
      </button>
    </section>
    <div class="content-layout" id="explore">
      <section class="explore-section" aria-labelledby="section-title">
        <div class="section-heading"><div><div class="section-overline" id="section-overline">按条件选菜</div><h2 id="section-title">全部菜品</h2></div><span class="results-count" id="results-count" role="status" aria-live="polite" aria-atomic="true"></span></div>
        <div id="rank-switch" class="rank-switch" hidden><button class="selected" data-rank="good">高分推荐</button><button data-rank="caution">低分提醒</button><span>按评分排序</span></div>
        <div class="filter-panel">
          <div class="filter-top"><div class="hall-filters" role="group" aria-label="选择食堂"><button class="selected" data-hall="all">全部食堂</button><button data-hall="南苑食堂">南苑</button><button data-hall="北苑食堂">北苑</button><button data-hall="湖畔食堂">湖畔</button></div><label class="search-box"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search-input" type="search" name="search" placeholder="搜索菜名或窗口" aria-label="搜索菜品或窗口" autocomplete="off"></label></div>
          <div class="filter-row">
            <div class="quick-links" role="group" aria-label="快捷选餐">
              <button data-shortcut="budget" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m9 9 3 3 3-3m-3 3v4m-3-3h6"/></svg>12元以内<span class="shortcut-check" aria-hidden="true">✓</span></button>
              <button data-shortcut="fast" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>5分钟出餐<span class="shortcut-check" aria-hidden="true">✓</span></button>
              <button data-shortcut="mild" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3c-1 10-2 18-12 16C0 10 9 4 20 3Zm-1 2L5 21"/></svg>不辣菜品<span class="shortcut-check" aria-hidden="true">✓</span></button>
            </div>
            <div class="select-filters">
              <label><span>类型</span><select id="category-filter" name="category"><option value="all">全部类型</option><option>米饭</option><option>面食</option><option>轻食</option><option>小吃</option></select></label>
              <label><span>预算</span><select id="price-filter" name="price"><option value="all">不限预算</option><option value="12">12元以内</option><option value="15">15元以内</option><option value="20">20元以内</option></select></label>
              <label><span>排序</span><select id="sort-filter" name="sort"><option value="recommended">口碑优先</option><option value="price">低价优先</option><option value="wait">出餐最快</option></select></label>
            </div>
          </div>
          <div id="active-filter" class="active-filter" hidden><span id="active-filter-text"></span><button data-action="clear">清除筛选 ×</button></div>
        </div>
        <div class="dish-grid" id="dish-grid"></div>
        <div class="menu-end" id="menu-end"><span></span>已显示全部结果<span></span></div>
      </section>
      <aside class="sidebar" aria-label="选餐参考">
        <section class="choice-card"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/></svg><h2>还是拿不定主意？</h2><p>选好预算和口味，随机推荐一道菜。</p><button class="button outline" data-action="random">随机选餐<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button></section>
        <section class="side-section"><div class="side-heading"><h3>12元以内，也吃好</h3></div><div id="budget-list"></div><button class="text-link" data-shortcut="budget">查看平价菜品<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button></section>
        <section class="caution-note"><div class="note-top"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>低分提醒</div><h3>点餐前，看看大家怎么说</h3><p>留意口味、分量和等餐反馈。</p><button class="text-link" data-action="caution">查看低分菜品<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button></section>
      </aside>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>今天吃哪口 · 校园食堂指南</span><button data-action="about">使用说明</button></div></footer>
  <dialog id="main-dialog" class="main-dialog" aria-label="菜品详情"><button class="dialog-close" data-action="close" aria-label="关闭弹窗"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请开启浏览器的 JavaScript，以使用菜品筛选、点评与收藏功能。</p></noscript>
</body>
</html>
