<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="按食堂和预算找一顿饭。看菜品、读点评、收藏下次想吃的。">
  <title>今天吃哪口 · 校园食堂</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./data.js" defer></script>
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <a class="skip-link" href="#dish-grid">跳转到菜品</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="今天吃哪口首页">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 21h28c-1 10-7 14-14 14S7 31 6 21Z" fill="currentColor"/><path d="M13 16c-5-5 5-5 0-11m8 11c-5-5 5-5 0-11m8 11c-5-5 5-5 0-11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>今天吃哪口</span>
      </a>
      <span class="campus-name">南湖大学<span>演示</span></span>
      <button class="saved-nav" data-view="saved" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4Z"/></svg>收藏<span id="saved-count"></span></button>
    </div>
  </header>

  <main class="page-shell" id="explore">
    <div class="page-heading">
      <h1 id="section-title">今天吃什么？</h1>
      <button class="button primary" data-action="random" id="pick-button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 8h.01M12 12h.01M16 16h.01" stroke-width="3"/></svg>帮我选</button>
    </div>

    <div class="browse-toolbar">
      <nav class="menu-tabs" aria-label="菜品分类">
        <button data-view="discover" class="active" aria-current="page">推荐</button>
        <button data-view="new">新菜</button>
        <button data-view="caution">避雷</button>
      </nav>
      <button class="back-link" data-action="discover" id="back-to-menu" hidden>← 返回菜品</button>
      <div class="main-filters">
        <label><span class="sr-only">食堂</span><select id="hall-filter"><option value="all">全部食堂</option><option>南苑食堂</option><option>北苑食堂</option><option>湖畔食堂</option></select></label>
        <label><span class="sr-only">预算</span><select id="price-filter"><option value="all">不限预算</option><option value="12">12元以内</option><option value="15">15元以内</option><option value="20">20元以内</option></select></label>
        <button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="extra-filters"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="2.5" fill="currentColor" stroke="none"/></svg>筛选<span id="filter-count" hidden></span></button>
      </div>
    </div>

    <section class="extra-filters" id="extra-filters" aria-label="更多筛选" hidden>
      <label class="search-field"><span>搜索</span><input id="search-input" type="search" placeholder="菜名或窗口" autocomplete="off"></label>
      <label><span>类型</span><select id="category-filter"><option value="all">全部</option><option>米饭</option><option>面食</option><option>轻食</option><option>小吃</option></select></label>
      <label><span>辣度</span><select id="spicy-filter"><option value="all">不限</option><option value="0">不辣</option><option value="1">最多微辣</option></select></label>
      <label><span>排序</span><select id="sort-filter"><option value="recommended">评分优先</option><option value="price">价格从低到高</option><option value="wait">出餐最快</option></select></label>
      <div class="extra-filter-bottom"><label class="check-label"><input type="checkbox" id="fast-filter">5分钟内出餐</label><button data-action="clear" class="clear-link">清除全部筛选</button></div>
    </section>
    <p class="filter-status" id="filter-status" hidden></p>

    <section class="dish-grid" id="dish-grid" aria-label="菜品列表" aria-live="polite"></section>
    <div class="list-end"><button class="button secondary" id="show-more" data-action="more" hidden>查看更多</button><span id="results-count"></span></div>
  </main>

  <footer class="site-footer"><span>菜品、评分为演示数据，图片仅作示意</span><button data-action="about">说明</button></footer>
  <dialog id="main-dialog" class="main-dialog" aria-label="菜品详情"><button class="dialog-close" data-action="close" aria-label="关闭">×</button><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript，以使用筛选、收藏和点评。</p></noscript>
</body>
</html>
